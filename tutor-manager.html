function generateFeedback() {
  const s = getStudent(selectedStudentId);
  if (!s) return;
  const idx = parseInt(document.getElementById('feedbackSessionSelect').value);
  const sess = s.sessions[idx];
  if (!sess) return;

  const typeInfo = SESSION_TYPES[sess.type] || SESSION_TYPES.knowledge;
  const encourage = ENCOURAGEMENTS[Math.floor(Math.random() * ENCOURAGEMENTS.length)];
  const weakMods = Object.entries(s.modules||{}).filter(([k,v]) => v >= 1 && v <= 2).map(([k]) => k);
  const strongMods = Object.entries(s.modules||{}).filter(([k,v]) => v >= 3).map(([k]) => k);
  const contentLines = (sess.content || '').split('\n').filter(l => l.trim());

  let fb = '';

  // Psychology sessions get a different template
  if (sess.type === 'psychology') {
    fb += `亲爱的家长您好！以下是${s.name}本次课程的沟通反馈：\n\n`;
    fb += `📅 沟通日期：${sess.date || todayStr()}\n\n`;
    fb += `💬 沟通内容\n`;
    fb += `本次课程我们进行了一次深入的学习沟通交流，主要围绕以下方面：\n`;
    contentLines.forEach(line => { fb += `${line}\n`; });
    fb += '\n';
    if (sess.notes) {
      fb += `📋 老师观察\n`;
      fb += `${sess.notes}\n\n`;
    }
    fb += `🌟 老师寄语\n`;
    fb += `${encourage}\n`;
    fb += `${s.name}是一个有潜力的孩子，通过今天的沟通，我相信TA会以更好的状态投入到后续的学习中。`;
    fb += `作为老师，我会持续关注TA的心理状态和学习情况，也请家长在日常生活中多给予鼓励和支持。\n\n`;
    fb += `如有任何问题，欢迎随时沟通交流。`;
  } else {
    // Normal teaching feedback
    fb += `亲爱的家长您好！以下是${s.name}本次课程的学习反馈：\n\n`;

    fb += `📚 课程信息\n`;
    fb += `上课日期：${sess.date || todayStr()}\n`;
    fb += `课程类型：${typeInfo.label}\n`;
    fb += `课程时长：${sess.duration || 1}小时\n\n`;

    fb += `📖 本节课内容\n`;
    if (contentLines.length > 0) {
      contentLines.forEach(line => { fb += `${line}\n`; });
    } else {
      fb += `${sess.content || '详见课堂笔记'}\n`;
    }
    fb += '\n';

    if (sess.homework) {
      fb += `📝 作业安排\n`;
      fb += `${sess.homework}\n`;
      fb += `请家长协助提醒孩子按时完成，有任何疑问欢迎随时沟通。\n\n`;
    }

    if (sess.notes) {
      fb += `💬 课堂表现\n`;
      fb += `${sess.notes}\n\n`;
    }

    // Improvement direction based on weak modules
    if (weakMods.length > 0) {
      fb += `🎯 后续教学计划\n`;
      fb += `接下来我们会重点关注以下模块的巩固提升：\n`;
      weakMods.slice(0, 3).forEach(m => { fb += `· ${m}\n`; });
      fb += `请家长鼓励孩子在家也多关注这些内容，有疑问随时联系我。\n\n`;
    }

    // Add exam score context if available
    if (s.exams && s.exams.length > 0) {
      const latest = s.exams[0]; // Already sorted desc
      const pct = (latest.score / latest.fullScore * 100).toFixed(1);
      fb += `📊 成绩参考\n`;
      fb += `最近一次考试（${latest.name}）得分率 ${pct}%`;
      if (s.exams.length >= 2) {
        const prev = s.exams[1];
        const prevPct = (prev.score / prev.fullScore * 100).toFixed(1);
        const diff = (parseFloat(pct) - parseFloat(prevPct)).toFixed(1);
        if (diff > 0) fb += `，较上次提升 ${diff} 个百分点`;
        else if (diff < 0) fb += `，较上次下降 ${Math.abs(diff)} 个百分点`;
      }
      fb += '。\n\n';
    }

    fb += `💪 老师寄语\n`;
    fb += `${encourage}\n`;
    fb += `${s.name}在这节课的表现整体不错，`;
    if (strongMods.length > 0) {
      fb += `在${strongMods[0]}方面已经有了很好的基础。`;
    } else {
      fb += `学习态度端正，值得肯定。`;
    }
    fb += `只要保持学习的节奏，相信一定会有更大的进步！\n\n`;
    fb += `如有任何问题，欢迎随时与我沟通交流，我们一起帮助${s.name}取得更好的成绩！`;
  }

  document.getElementById('feedbackContent').textContent = fb;
}

function copyFeedback() {
  const el = document.getElementById('feedbackContent');
  if (el) {
    navigator.clipboard.writeText(el.textContent).then(() => {
      // Mark feedback as sent
      const s = getStudent(selectedStudentId);
      if (s) {
        const idx = parseInt(document.getElementById('feedbackSessionSelect').value);
        if (s.sessions[idx]) {
          s.sessions[idx].feedbackSent = true;
          saveData(appData);
        }
      }
      alert('课后反馈已复制到剪贴板');
    });
  }
}

function openFeedbackForSession(sid) {

  if (!s) return;
  const idx = s.sessions.findIndex(x => x.id === sid);
  if (idx < 0) return;

}

function openAddExam() {
  document.getElementById('examModalTitle').textContent = '添加考试';
  document.getElementById('editExamId').value = '';
  document.getElementById('eName').value = '';
  document.getElementById('eType').value = '月考';
  document.getElementById('eDate').value = todayStr();
  document.getElementById('eScore').value = '';
  document.getElementById('eFullScore').value = 150;
  document.getElementById('eRank').value = '';
  document.getElementById('eNotes').value = '';
  openModal('examModal');
}

function openEditExam(eid) {
  const s = getStudent(selectedStudentId);
  const e = s.exams.find(x => x.id === eid);
  if (!e) return;
  document.getElementById('examModalTitle').textContent = '编辑考试';
  document.getElementById('editExamId').value = eid;
  document.getElementById('eName').value = e.name || '';
  document.getElementById('eType').value = e.type || '月考';
  document.getElementById('eDate').value = e.date || '';
  document.getElementById('eScore').value = e.score;
  document.getElementById('eFullScore').value = e.fullScore || 150;
  document.getElementById('eRank').value = e.rank || '';
  document.getElementById('eNotes').value = e.notes || '';
  openModal('examModal');
}

function saveExam() {
  const s = getStudent(selectedStudentId);
  if (!s) return;
  const name = document.getElementById('eName').value.trim();
  const score = parseFloat(document.getElementById('eScore').value);
  if (!name || isNaN(score)) { alert('请填写考试名称和分数'); return; }
  const editId = document.getElementById('editExamId').value;
  const examData = {
    name, type: document.getElementById('eType').value,
    date: document.getElementById('eDate').value, score,
    fullScore: parseFloat(document.getElementById('eFullScore').value) || 150,
    rank: document.getElementById('eRank').value.trim(),
    notes: document.getElementById('eNotes').value.trim()
  };
  if (editId) {
    const idx = s.exams.findIndex(x => x.id === editId);
    if (idx >= 0) Object.assign(s.exams[idx], examData);
  } else {
    s.exams.push({ id: genId(), ...examData });
  }
  s.exams.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  saveData(appData);
  closeModal('examModal');
  renderPage();
}

function deleteExam(eid) {
  if (!confirm('确定删除此考试记录？')) return;
  const s = getStudent(selectedStudentId);
  s.exams = s.exams.filter(x => x.id !== eid);
  saveData(appData);
  renderPage();
}

let radarChart = null;

    </div>
  `;

function buildReport(period) {
  const s = getStudent(selectedStudentId);
  if (!s) return '';
  const now = new Date();
  let startDate;
  if (period === 'month') { startDate = new Date(now); startDate.setMonth(startDate.getMonth()-1); }
  else if (period === 'quarter') { startDate = new Date(now); startDate.setMonth(startDate.getMonth()-3); }
  else if (period === 'semester') { startDate = new Date(now.getFullYear(), now.getMonth() < 7 ? 0 : 6, 1); }
  else { startDate = new Date(2020,0,1); }
  const startStr = startDate.toISOString().slice(0,10);

  const sessions = s.sessions.filter(sess => sess.date >= startStr);
  const exams = s.exams.filter(e => e.date >= startStr);
  const totalHours = sessions.reduce((a,b) => a + (b.duration||0), 0);

  // Session type breakdown
  const typeBreakdown = {};
  sessions.forEach(sess => {
    const type = sess.type || 'knowledge';
    const info = SESSION_TYPES[type] || SESSION_TYPES.knowledge;
    typeBreakdown[info.label] = (typeBreakdown[info.label] || 0) + 1;
  });

  // Calculate trend
  let trend = '持平';
  let trendDetail = '';
  if (exams.length >= 2) {
    const sorted = [...exams].sort((a,b) => (a.date||'').localeCompare(b.date||''));
    const first = sorted[0].score / sorted[0].fullScore * 100;
    const last = sorted[sorted.length-1].score / sorted[sorted.length-1].fullScore * 100;
    const diff = (last - first).toFixed(1);
    if (last - first > 5) { trend = '明显进步'; trendDetail = `得分率从 ${first.toFixed(1)}% 提升至 ${last.toFixed(1)}%，提升 ${diff} 个百分点`; }
    else if (last - first > 0) { trend = '稳步提升'; trendDetail = `得分率从 ${first.toFixed(1)}% 提升至 ${last.toFixed(1)}%`; }
    else if (last - first < -5) { trend = '有所下滑'; trendDetail = `得分率从 ${first.toFixed(1)}% 下降至 ${last.toFixed(1)}%，需要关注`; }
    else { trend = '基本持平'; trendDetail = `得分率维持在 ${last.toFixed(1)}% 左右`; }
  }

  // Weak modules
  const weakMods = Object.entries(s.modules||{}).filter(([k,v]) => v <= 1 && v > 0).map(([k]) => k);
  const strongMods = Object.entries(s.modules||{}).filter(([k,v]) => v >= 3).map(([k]) => k);

  let report = `📊 学习报告 — ${s.name}\n`;
  report += `${'━'.repeat(30)}\n\n`;
  report += `👤 学生信息\n`;
  report += `姓名：${s.name}  年级：${s.grade}\n`;
  report += `报告周期：${period === 'month' ? '最近一个月' : period === 'quarter' ? '最近三个月' : period === 'semester' ? '本学期' : '全部'}\n\n`;

  report += `📚 课程概况\n`;
  report += `上课次数：${sessions.length} 次\n`;
  report += `累计课时：${totalHours} 小时\n`;
  if (Object.keys(typeBreakdown).length > 0) {
    report += `课程构成：${Object.entries(typeBreakdown).map(([k,v]) => `${k} ${v}次`).join('、')}\n`;
  }
  report += '\n';

  if (exams.length > 0) {
    report += `📈 考试成绩\n`;
    exams.forEach(e => {
      const pct = (e.score / e.fullScore * 100).toFixed(1);
      report += `· ${e.name}（${e.date}）：${e.score}/${e.fullScore}，得分率 ${pct}%`;
      if (e.rank) report += `，排名 ${e.rank}`;
      report += '\n';
    });
    report += `\n成绩趋势：${trend}`;
    if (trendDetail) report += `\n${trendDetail}`;
    report += '\n\n';
  }

  if (strongMods.length > 0) {
    report += `✅ 掌握较好的模块\n`;
    strongMods.forEach(m => { report += `· ${m}\n`; });
    report += '\n';
  }
  if (weakMods.length > 0) {
    report += `⚠️ 需要加强的模块\n`;
    weakMods.forEach(m => { report += `· ${m}\n`; });
    report += '\n';
  }

  // Recent content
  if (sessions.length > 0) {
    report += `📝 近期教学内容\n`;
    sessions.slice(0,5).forEach(sess => {
      const typeInfo = SESSION_TYPES[sess.type] || SESSION_TYPES.knowledge;
      report += `· ${sess.date} [${typeInfo.label}]：${(sess.content||'').slice(0,50)}\n`;
    });
    report += '\n';
  }

  // Next steps
  report += `🎯 后续教学计划\n`;
  if (weakMods.length > 0) {
    report += `1. 重点巩固以下薄弱模块：${weakMods.slice(0,3).join('、')}\n`;
    report += `2. 针对性练习，强化解题能力\n`;
  }
  if (s.grade === '高三') {
    report += `${weakMods.length > 0 ? '3' : '1'}. 持续进行高考模拟训练，提升应试能力\n`;
  }
  report += '\n';

  // Open issues (internal only, not shown to parents)
  const openIssues = (s.issues||[]).filter(i => i.status === 'open');
  if (openIssues.length > 0) {
    report += `🔍 待跟进事项（内部记录）\n`;
    openIssues.forEach(i => { report += `· ${i.description}\n`; });
    report += '\n';
  }

  report += `${'━'.repeat(30)}\n`;
  report += `以上报告由数学家教系统生成\n`;
  report += `如有疑问请随时沟通，感谢您的信任与配合！`;

  return report;
}

function copyReportText() {
  const el = document.getElementById('reportText');
  if (el) {
    navigator.clipboard.writeText(el.textContent).then(() => alert('报告已复制到剪贴板'));
  }
}

// ============ SUGGESTIONS ============
function renderSuggest(container) {
  const s = getStudent(selectedStudentId);
  if (!s) { renderStudentPicker(container, currentPage); return; }

  const suggestions = [];

  // Find weak modules (only "了解" level = need reinforcement, skip "未接触")
  const weakMods = Object.entries(s.modules||{}).filter(([k,v]) => v === 1).map(([k]) => k);
  const untouchedMods = Object.entries(s.modules||{}).filter(([k,v]) => v === 0).map(([k]) => k);
  if (weakMods.length > 0) {
    suggestions.push({
      icon: '⚠️',
      title: '薄弱模块需要巩固',
      desc: `以下模块处于「了解」级别，建议优先安排复习巩固：\n${weakMods.map(m => '· ' + m).join('\n')}`,
      priority: 'high'
    });
  }
  if (untouchedMods.length > 0 && untouchedMods.length < Object.keys(s.modules||{}).length) {
    suggestions.push({
      icon: '📋',
      title: '尚未接触的模块',
      desc: `以下模块暂未接触，不急于排课，待当前薄弱模块巩固后再逐步引入：\n${untouchedMods.slice(0,6).map(m => '· ' + m).join('\n')}${untouchedMods.length>6 ? '\n· ...' : ''}`,
      priority: ''
    });
  }

  // Recent exam analysis
  if (s.exams.length >= 2) {
    const sorted = [...s.exams].sort((a,b) => (a.date||'').localeCompare(b.date||''));
    const recent = sorted.slice(-3);
    const avgPct = recent.reduce((a,e) => a + e.score/e.fullScore*100, 0) / recent.length;
    if (avgPct < 60) {
      suggestions.push({
        icon: '📉',
        title: '近期成绩偏低',
        desc: `最近${recent.length}次考试平均得分率 ${avgPct.toFixed(1)}%，建议加强基础训练，适当降低难度，建立信心。`,
        priority: 'high'
      });
    } else if (avgPct < 80) {
      suggestions.push({
        icon: '📊',
        title: '成绩有提升空间',
        desc: `平均得分率 ${avgPct.toFixed(1)}%，处于中等水平。建议针对错题进行专项训练，突破瓶颈。`,
        priority: 'medium'
      });
    }
  }

  // Session frequency
  const recent30 = s.sessions.filter(sess => {
    const d = new Date(); d.setDate(d.getDate()-30);
    return sess.date >= d.toISOString().slice(0,10);
  });
  if (recent30.length < 4 && s.sessions.length > 0) {
    suggestions.push({
      icon: '📅',
      title: '上课频率偏低',
      desc: '最近30天上课次数不足4次，建议保持稳定的上课节奏，避免知识遗忘。',
      priority: 'medium'
    });
  }

  // Unresolved issues
  const openIssues = (s.issues||[]).filter(i => i.status === 'open');
  if (openIssues.length > 0) {
    suggestions.push({
      icon: '🔍',
      title: '有待解决的学习问题',
      desc: `有 ${openIssues.length} 个学习问题待解决：\n${openIssues.slice(0,3).map(i => '· '+i.description).join('\n')}`,
      priority: 'medium'
    });
  }

  // Grade-specific suggestions
  if (s.grade === '高三') {
    suggestions.push({
      icon: '🎓',
      title: '高考备考建议',
      desc: '高三学生建议：1）每周至少一次模拟练习；2）重点突破薄弱模块；3）建立错题本；4）合理分配各模块复习时间。',
      priority: 'high'
    });
  }

  // Default suggestion if nothing else
  if (suggestions.length === 0) {
    suggestions.push({
      icon: '✅',
      title: '状态良好',
      desc: '当前学生学习状态良好，继续保持！建议定期检查各模块掌握度，确保没有遗漏。',
      priority: ''
    });
  }

  let html = `
    <div class="card" style="margin-bottom:16px">
      <div class="card-header"><h3>🎯 智能排课建议 - ${escapeHtml(s.name)}</h3></div>
      <div class="card-body">
        ${suggestions.map(sg => `<div class="suggestion-card">
          <div class="suggestion-icon">${sg.icon}</div>
          <div>
            <div class="suggestion-title">${sg.title}${sg.priority ? `<span class="suggestion-priority priority-${sg.priority}">${sg.priority==='high'?'重要':'建议'}</span>` : ''}</div>
            <div class="suggestion-desc">${escapeHtml(sg.desc)}</div>
          </div>
        </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-header">
        <h3>🔍 学习问题追踪</h3>
        <button class="btn btn-sm btn-primary" onclick="openModal('issueModal')">+ 记录问题</button>
      </div>
      <div class="card-body">
        ${(s.issues||[]).length === 0 ? '<div class="empty-state" style="padding:20px">暂无学习问题记录</div>' :
          (s.issues||[]).map(iss => `<div class="issue-item">
            <div class="issue-status ${iss.status==='resolved'?'resolved':''}" onclick="toggleIssue('${iss.id}')">${iss.status==='resolved'?'✓':''}</div>
            <div class="issue-text ${iss.status==='resolved'?'resolved':''}">${escapeHtml(iss.description)}</div>
            <div class="issue-date">${iss.createdAt ? new Date(iss.createdAt).toLocaleDateString() : ''}</div>
          </div>`).join('')}
      </div>
    </div>
  `;
  container.innerHTML = html;
}

function saveIssue() {
  const s = getStudent(selectedStudentId);
  if (!s) return;
  const text = document.getElementById('issueText').value.trim();
  if (!text) { alert('请输入问题描述'); return; }
  if (!s.issues) s.issues = [];
  s.issues.push({ id: genId(), description: text, status: 'open', createdAt: Date.now() });
  saveData(appData);
  document.getElementById('issueText').value = '';
  closeModal('issueModal');
  renderPage();
}

function toggleIssue(iid) {
  const s = getStudent(selectedStudentId);
  if (!s) return;
  const iss = (s.issues||[]).find(i => i.id === iid);
  if (iss) {
    iss.status = iss.status === 'open' ? 'resolved' : 'open';
    if (iss.status === 'resolved') iss.resolvedAt = Date.now();
    saveData(appData);
    renderPage();
  }
}

// ============ SEARCH ============
function globalSearchFn(query) {
  if (currentPage !== 'students') switchPage('students');
  const cards = document.querySelectorAll('.student-card-item');
  const q = query.toLowerCase();
  cards.forEach(card => {
    const text = card.textContent.toLowerCase();
    card.style.display = text.includes(q) ? '' : 'none';
  });
}

// ============ IMPORT/EXPORT ============
function exportData() {
  const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `tutor-data-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.students && Array.isArray(imported.students)) {
        if (confirm(`确定导入数据？将覆盖当前 ${appData.students.length} 位学生数据。`)) {
          appData = imported;
          saveData(appData);
          renderPage();
          alert('数据导入成功！');
        }
      } else {
        alert('文件格式不正确');
      }
    } catch(err) {
      alert('文件解析失败：' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ============ INIT ============
async function doInit() {
  appData = await initStorage();

  // 读取到空数据或无效数据，视为失败
  if (appData && (!appData.students || !Array.isArray(appData.students))) {
    appData = null;
  }

  if (appData !== null) {
    lastLoadTime = new Date();
  }

  if (appData === null) {
    // 首次使用或文件句柄丢失，显示设置界面
    let oldData = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.students && parsed.students.length > 0) oldData = parsed;
      }
    } catch {}

    const c = document.getElementById('pageContent');
    const hadHandle = dataFileHandle !== null || dataFileName !== '';
    c.innerHTML = `
      <div style="max-width:500px;margin:60px auto;text-align:center">
        <div style="font-size:3em;margin-bottom:16px">📐</div>
        <h2 style="margin-bottom:8px">${hadHandle ? '数据文件关联已失效' : '欢迎使用数学家教管理系统'}</h2>
        <p style="color:var(--text-light);margin-bottom:30px">${hadHandle ? '请重新选择数据文件（坚果云同步文件夹中的 json 文件）' : '首次使用，请选择数据文件的保存位置<br>建议保存到坚果云同步文件夹，实现多设备同步'}</p>
        ${oldData ? `
        <div style="background:var(--warning-bg);border:1px solid var(--warning);border-radius:var(--radius);padding:16px;margin-bottom:20px;text-align:left">
          <strong>⚠️ 发现旧数据</strong>：浏览器中有 ${oldData.students.length} 位学生的数据<br>
          <span style="font-size:0.85em;color:var(--text-light)">点击下方「恢复旧数据」可将其保存到新文件中</span>
        </div>
        ` : ''}
        <div style="display:flex;flex-direction:column;gap:12px;align-items:center">
          <button class="btn btn-primary" style="padding:12px 32px;font-size:1em;width:280px" onclick="setupOpenFile()">
            📂 打开数据文件（推荐）
          </button>
          <button class="btn btn-outline" style="padding:12px 32px;font-size:1em;width:280px" onclick="setupCreateFile(${oldData ? 'true' : 'false'})">
            📄 创建新数据文件
          </button>
          ${oldData ? `
          <button class="btn btn-outline" style="padding:12px 32px;font-size:1em;width:280px;color:var(--warning);border-color:var(--warning)" onclick="setupRecoverOld()">
            🔄 恢复旧数据到新文件
          </button>
          ` : ''}
        </div>
      </div>
    `;
    return;
  }

  updateFileStatus();
  renderPage();
}

async function setupCreateFile(hasOld) {
  const data = await createDataFile();
  if (data) {
    if (hasOld) {
      // 创建了文件，但不自动导入旧数据，让用户选择
    }
    appData = data;
    lastLoadTime = new Date();
    updateFileStatus();
    renderPage();
  }
}

async function setupOpenFile() {
  if (await selectDataFile()) {
    const data = await readFile(dataFileHandle);
    if (data && data.students) {
      appData = data;
      lastLoadTime = new Date();
    } else {
      alert('文件格式不正确');
      appData = { students: [], settings: { customModules: [] } };
    }
    updateFileStatus();
    renderPage();
  }
}

async function setupRecoverOld() {
  // 先创建文件
  const fileData = await createDataFile();
  if (!fileData) return;
  // 读取旧数据
  let oldData = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.students && parsed.students.length > 0) oldData = parsed;
    }
  } catch {}
  if (oldData) {
    appData = oldData;
    await saveData(appData);
    alert(`已恢复 ${oldData.students.length} 位学生的数据！`);
  } else {
    appData = fileData;
  }
  lastLoadTime = new Date();
  updateFileStatus();
  renderPage();
}

doInit();
</script>
</body>
</html>
